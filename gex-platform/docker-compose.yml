services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: gex_db
      POSTGRES_USER: gex_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gex_user -d gex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./gex-backend
    env_file: ./gex-backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./gex-frontend
    ports:
      - "5173:80"

  proxy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
